<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tahu Kocek">
<meta name="theme-color" content="#4a0703">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tahu Kocek Merapi</title>
<style>
:root{--txt:#fff4e6;--mut:#f0b49a;--red:#e5200f;--yel:#ffd21f;--org:#ff7a00;--glass:linear-gradient(135deg,rgba(255,255,255,.1),rgba(20,2,1,.38));--gb:1px solid rgba(255,255,255,.16);--gs:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.45);--blur:blur(20px) saturate(180%);--hot:linear-gradient(135deg,rgba(255,70,20,.85),rgba(255,160,0,.7));color-scheme:dark;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:#120201 linear-gradient(160deg,#120201,#4a0703 50%,#120201);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
html::before,body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(55px);pointer-events:none}
html::before{width:300px;height:300px;right:-80px;top:-60px;background:radial-gradient(circle,#ff3d00,#b3120a 70%);opacity:.5;animation:f3 16s ease-in-out infinite}
body::before{width:360px;height:360px;left:-120px;top:38%;background:radial-gradient(circle,#ff2a00,#8a0c05 70%);opacity:.55;animation:f1 14s ease-in-out infinite}
body::after{width:380px;height:380px;right:-130px;bottom:4%;background:radial-gradient(circle,#ffc400,#ff6a00 60%);opacity:.4;animation:f2 18s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,-70px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,60px)}}
@keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,90px)}}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:14px 16px 210px}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:4px}
.chip{font:inherit;font-size:12px;color:var(--txt);padding:7px 12px;border-radius:16px;cursor:pointer;background:var(--glass);border:var(--gb);box-shadow:var(--gs);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.logo{display:block;width:170px;height:170px;border-radius:50%;margin:6px auto 4px;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 22px #ff4a0077}50%{box-shadow:0 0 54px #ff6a00cc}}
h1{text-align:center;margin:6px 0 2px;font-size:27px;color:var(--yel);animation:fl 2.2s ease-in-out infinite}
@keyframes fl{0%,100%{text-shadow:0 0 8px #ff5a00}50%{text-shadow:0 0 20px #ff2a00,0 0 4px #ffd21f}}
.sub{text-align:center;color:var(--mut);margin:0 0 6px;font-size:14px}
h2{font-size:16px;margin:22px 0 10px;color:var(--yel)}
.req{color:var(--mut);font-size:12px;font-weight:400}
.pane{display:none}.pane.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:10px}
.btn{font:inherit;color:var(--txt);background:var(--glass);border:var(--gb);border-radius:14px;padding:12px 14px;cursor:pointer;transition:transform .25s ease,background .3s ease,border-color .3s ease,box-shadow .3s ease}
.btn:active{transform:scale(.96)}
.btn.on{background:var(--hot);border:1px solid rgba(255,235,170,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 28px rgba(255,90,0,.7)}
#lvl{max-height:0;opacity:0;overflow:hidden;margin:0 -8px -12px;padding:0 8px 12px;transition:max-height .7s ease,opacity .6s ease}
#lvl.show{max-height:700px;opacity:1}
.row{background:var(--glass);border:var(--gb);border-radius:20px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--gs);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.rh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}.rh em{font-style:normal;color:var(--yel);font-weight:700}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nums .btn{padding:10px 0;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:var(--glass);border:var(--gb);box-shadow:var(--gs);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transition:background .3s,border-color .3s,box-shadow .3s}
.trow.on{background:linear-gradient(135deg,rgba(255,70,20,.35),rgba(255,160,0,.25));border-color:rgba(255,235,170,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 22px rgba(255,90,0,.45)}
.tn b{display:block;font-size:16px}.tn span{font-size:13px;color:var(--mut)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:40px;height:40px;border-radius:50%;font:inherit;font-size:22px;line-height:1;color:#fff;border:1px solid rgba(255,235,170,.5);background:var(--hot);cursor:pointer;transition:transform .2s,opacity .3s}
.qty button:active{transform:scale(.86)}.qty button:disabled{opacity:.3;background:rgba(255,255,255,.1)}
.qty i{font-style:normal;min-width:28px;text-align:center;font-size:19px;font-weight:700;color:var(--yel)}
.nota{background:var(--glass);border:var(--gb);border-radius:20px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.65;box-shadow:var(--gs);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);animation:in .45s ease}
.nh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px dashed rgba(255,255,255,.2);padding-bottom:6px;margin-bottom:6px}
.nh span{color:var(--mut);font-size:13px}.nt{color:var(--yel);font-weight:700}
.na{display:flex;gap:8px;margin-top:10px}
.na a,.na button{font:inherit;font-size:13px;color:#fff;border-radius:8px;padding:8px 14px;text-decoration:none;border:0;cursor:pointer}
.na a{background:rgba(31,168,85,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}.na button{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25)}
.empty{color:var(--mut);font-size:14px;text-align:center;margin-top:30px}
.bar,.tabs{position:fixed;left:12px;right:12px;max-width:536px;margin:0 auto;background:rgba(18,3,2,.62);border:var(--gb);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:var(--gs)}
.bar{bottom:calc(72px + env(safe-area-inset-bottom,0px));border-radius:24px;padding:10px 14px;transition:transform .4s ease,opacity .4s ease}
.bar.hide{transform:translateY(130%);opacity:0;pointer-events:none}
.bi{display:flex;align-items:center;gap:12px}
.tot{flex:1;font-size:13px;color:var(--mut)}.tot b{display:block;font-size:20px;color:var(--yel)}
#order{font:inherit;font-weight:700;border:1px solid rgba(255,235,170,.6);border-radius:12px;padding:13px 28px;color:#fff;background:var(--hot);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 20px rgba(255,70,0,.5);cursor:pointer;transition:transform .2s,opacity .3s}
#order:active{transform:scale(.94)}#order:disabled{opacity:.4}
.tabs{bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;padding:4px;gap:4px;border-radius:28px}
.tabs button{flex:1;font:inherit;font-size:14px;color:var(--mut);background:none;border:0;padding:11px 0;border-radius:22px;cursor:pointer;transition:color .3s,background .3s}
.tabs button.on{color:var(--yel);background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 10px rgba(0,0,0,.25)}
.tabs i{font-style:normal;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;margin-left:4px}
.cards{display:grid;gap:10px}
.card{background:linear-gradient(135deg,rgba(120,10,4,.55),rgba(20,2,1,.6));border:var(--gb);border-radius:20px;padding:14px 16px;box-shadow:var(--gs);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);animation:in .45s ease}
.card small{color:var(--mut);font-size:13px}.card b{display:block;font-size:24px;color:var(--yel);margin:2px 0}.card span{font-size:13px}
.bars{background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(15,2,1,.45));border:var(--gb);border-radius:20px;padding:8px 14px;box-shadow:var(--gs)}
.br{display:flex;align-items:center;gap:8px;font-size:12px;margin:8px 0}.br u{width:84px;text-decoration:none;color:var(--mut)}
.br div{flex:1;height:10px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.br i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yel));border-radius:6px;transition:width .6s ease}
.br em{font-style:normal;width:84px;text-align:right}
.pills{display:flex;gap:6px;margin-bottom:12px}
.pills button{flex:1;font:inherit;font-size:13px;color:var(--mut);background:var(--glass);border:var(--gb);border-radius:10px;padding:9px 0;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.pills button.on{color:#fff;background:var(--hot);border-color:rgba(255,235,170,.9)}
.nav2{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.nav2 button{font:inherit;color:var(--txt);background:var(--glass);border:var(--gb);border-radius:10px;width:44px;height:38px;font-size:20px;cursor:pointer}
.nav2 button:disabled{opacity:.3}.nav2 span{flex:1;text-align:center;font-size:14px;color:var(--yel)}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,1,1,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.show{opacity:1;pointer-events:auto}
.mbox{width:100%;max-width:360px;max-height:88vh;overflow-y:auto;border-radius:24px;padding:20px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(25,3,2,.85));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 20px 50px rgba(0,0,0,.5);transform:translateY(16px) scale(.97);transition:transform .35s ease}
.modal.show .mbox{transform:none}
.mbox h3{margin:0 0 4px;color:var(--yel);font-size:18px}.mbox h4{margin:14px 0 8px;color:var(--yel);font-size:14px}
.mbox p{font-size:13px;color:var(--mut);margin:6px 0 12px;line-height:1.5}.mbox p b{color:var(--txt)}
.mbox input{width:100%;font:inherit;font-size:16px;color:var(--txt);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px 14px;margin-bottom:10px;outline:0}
.mbox input:focus{border-color:var(--org)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-size:13px;color:var(--mut);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 0;cursor:pointer}
.seg button.on{color:#fff;background:var(--hot);border-color:rgba(255,235,170,.9)}
.mb{width:100%;font:inherit;font-weight:700;color:#fff;border:1px solid rgba(255,235,170,.6);border-radius:12px;padding:12px;cursor:pointer;background:var(--hot)}
.mb.g{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);margin-top:8px;font-weight:400}
.mb:disabled{opacity:.5}.mb.sm{padding:9px;font-size:13px;margin-bottom:6px}
.er{color:#ff9a8a!important;min-height:18px;margin:0 0 8px!important}
.ed{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ed input{width:auto;margin:0;min-width:0}.ed .en{flex:1.6}.ed .ep,.ed .el{flex:1}
.ed .ex{width:40px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.ed .ln{flex:1;font-size:14px}
</style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <button class="chip" id="bEdit">✏️ Edit</button>
    <button class="chip" id="bAkun">👤 Akun</button>
  </div>
  <img class="logo" alt="Logo Tahu Kocek Merapi" src="icon-192.png">
  <h1>Tahu Kocek Merapi</h1>
  <p class="sub">Pedas gurih banget! 🔥</p>

  <section class="pane on" id="p-menu">
    <h2>1. Pilih Jenis Tahu Kocek <span class="req">(opsional, maks. 50 per jenis)</span></h2>
    <div class="grid" id="jenis"></div>
    <div id="lvl">
      <h2>2. Pilih Level Kepedasan <span class="req">(opsional)</span></h2>
      <div id="lvlrows"></div>
    </div>
    <h2>3. Topping <span class="req">(opsional, maks. 25 per jenis)</span></h2>
    <div class="grid" id="top"></div>
    <h2>4. Jajan <span class="req">(opsional, maks. 25 per jenis)</span></h2>
    <div class="grid" id="jajan"></div>
  </section>

  <section class="pane" id="p-nota">
    <h2>Riwayat Nota</h2>
    <div id="hist"></div>
  </section>

  <section class="pane" id="p-lap">
    <h2>Penghasilan</h2>
    <div id="lap"></div>
  </section>
</main>

<div class="bar" id="bar"><div class="bi">
  <div class="tot" id="ring">Pilih menu dulu<b>Rp 0</b></div>
  <button id="order" disabled>OK</button>
</div></div>
<nav class="tabs">
  <button class="on" data-t="menu">🔥 Menu</button>
  <button data-t="nota">🧾 Nota<i id="cnt" hidden></i></button>
  <button data-t="laporan">💰 Laporan</button>
</nav>

<div class="modal" id="mEdit"></div>
<div class="modal" id="mAkun"></div>

<script src="app.js?v=5"></script>
<script src="akun.js?v=5"></script>
</body>
</html>
