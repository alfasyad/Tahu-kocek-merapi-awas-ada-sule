<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tahu Kocek">
<meta name="theme-color" content="#4a0703">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tahu Kocek Merapi</title>
<style>
:root{--txt:#fff4e6;--mut:#f0b49a;--red:#e5200f;--yel:#ffd21f;--org:#ff7a00;--glass:linear-gradient(135deg,rgba(255,255,255,.1),rgba(20,2,1,.38));--gb:1px solid rgba(255,255,255,.16);--gs:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.45);--blur:blur(20px) saturate(180%);--hot:linear-gradient(135deg,rgba(255,70,20,.85),rgba(255,160,0,.7));color-scheme:dark;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:#120201 linear-gradient(160deg,#120201,#4a0703 50%,#120201);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
html::before,body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(55px);pointer-events:none}
html::before{width:300px;height:300px;right:-80px;top:-60px;background:radial-gradient(circle,#ff3d00,#b3120a 70%);opacity:.5;animation:f3 16s ease-in-out infinite}
body::before{width:360px;height:360px;left:-120px;top:38%;background:radial-gradient(circle,#ff2a00,#8a0c05 70%);opacity:.55;animation:f1 14s ease-in-out infinite}
body::after{width:380px;height:380px;right:-130px;bottom:4%;background:radial-gradient(circle,#ffc400,#ff6a00 60%);opacity:.4;animation:f2 18s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,-70px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,60px)}}
@keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,90px)}}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:14px 16px 210px}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:4px}
.chip{font:inherit;font-size:12px;color:var(--txt);padding:7px 12px;border-radius:16px;cursor:pointer;background:var(--glass);border:var(--gb);box-shadow:var(--gs);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.logo{display:block;width:170px;height:170px;border-radius:50%;margin:6px auto 4px;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 22px #ff4a0077}50%{box-shadow:0 0 54px #ff6a00cc}}
h1{text-align:center;margin:6px 0 2px;font-size:27px;color:var(--yel);animation:fl 2.2s ease-in-out infinite}
@keyframes fl{0%,100%{text-shadow:0 0 8px #ff5a00}50%{text-shadow:0 0 20px #ff2a00,0 0 4px #ffd21f}}
.sub{text-align:center;color:var(--mut);margin:0 0 6px;font-size:14px}
h2{font-size:16px;margin:22px 0 10px;color:var(--yel)}
.req{color:var(--mut);font-size:12px;font-weight:400}
.pane{display:none}.pane.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:10px}
.btn{font:inherit;color:var(--txt);background:var(--glass);border:var(--gb);border-radius:14px;padding:12px 14px;cursor:pointer;transition:transform .25s ease,background .3s ease,border-color .3s ease,box-shadow .3s ease}
.btn:active{transform:scale(.96)}
.btn.on{background:var(--hot);border:1px solid rgba(255,235,170,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 28px rgba(255,90,0,.7)}
#lvl{max-height:0;opacity:0;overflow:hidden;margin:0 -8px -12px;padding:0 8px 12px;transition:max-height .7s ease,opacity .6s ease}
#lvl.show{max-height:700px;opacity:1}
.row{background:var(--glass);border:var(--gb);border-radius:20px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--gs);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.rh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}.rh em{font-style:normal;color:var(--yel);font-weight:700}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nums .btn{padding:10px 0;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:var(--glass);border:var(--gb);box-shadow:var(--gs);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transition:background .3s,border-color .3s,box-shadow .3s}
.trow.on{background:linear-gradient(135deg,rgba(255,70,20,.35),rgba(255,160,0,.25));border-color:rgba(255,235,170,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 22px rgba(255,90,0,.45)}
.tn b{display:block;font-size:16px}.tn span{font-size:13px;color:var(--mut)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:40px;height:40px;border-radius:50%;font:inherit;font-size:22px;line-height:1;color:#fff;border:1px solid rgba(255,235,170,.5);background:var(--hot);cursor:pointer;transition:transform .2s,opacity .3s}
.qty button:active{transform:scale(.86)}.qty button:disabled{opacity:.3;background:rgba(255,255,255,.1)}
.qty i{font-style:normal;min-width:28px;text-align:center;font-size:19px;font-weight:700;color:var(--yel)}
.nota{background:var(--glass);border:var(--gb);border-radius:20px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.65;box-shadow:var(--gs);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);animation:in .45s ease}
.nh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px dashed rgba(255,255,255,.2);padding-bottom:6px;margin-bottom:6px}
.nh span{color:var(--mut);font-size:13px}.nt{color:var(--yel);font-weight:700}
.na{display:flex;gap:8px;margin-top:10px}
.na a,.na button{font:inherit;font-size:13px;color:#fff;border-radius:8px;padding:8px 14px;text-decoration:none;border:0;cursor:pointer}
.na a{background:rgba(31,168,85,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}.na button{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25)}
.empty{color:var(--mut);font-size:14px;text-align:center;margin-top:30px}
.bar,.tabs{position:fixed;left:12px;right:12px;max-width:536px;margin:0 auto;background:rgba(18,3,2,.62);border:var(--gb);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:var(--gs)}
.bar{bottom:calc(72px + env(safe-area-inset-bottom,0px));border-radius:24px;padding:10px 14px;transition:transform .4s ease,opacity .4s ease}
.bar.hide{transform:translateY(130%);opacity:0;pointer-events:none}
.bi{display:flex;align-items:center;gap:12px}
.tot{flex:1;font-size:13px;color:var(--mut)}.tot b{display:block;font-size:20px;color:var(--yel)}
#order{font:inherit;font-weight:700;border:1px solid rgba(255,235,170,.6);border-radius:12px;padding:13px 28px;color:#fff;background:var(--hot);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 20px rgba(255,70,0,.5);cursor:pointer;transition:transform .2s,opacity .3s}
#order:active{transform:scale(.94)}#order:disabled{opacity:.4}
.tabs{bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;padding:4px;gap:4px;border-radius:28px}
.tabs button{flex:1;font:inherit;font-size:14px;color:var(--mut);background:none;border:0;padding:11px 0;border-radius:22px;cursor:pointer;transition:color .3s,background .3s}
.tabs button.on{color:var(--yel);background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 10px rgba(0,0,0,.25)}
.tabs i{font-style:normal;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;margin-left:4px}
.cards{display:grid;gap:10px}
.card{background:linear-gradient(135deg,rgba(120,10,4,.55),rgba(20,2,1,.6));border:var(--gb);border-radius:20px;padding:14px 16px;box-shadow:var(--gs);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);animation:in .45s ease}
.card small{color:var(--mut);font-size:13px}.card b{display:block;font-size:24px;color:var(--yel);margin:2px 0}.card span{font-size:13px}
.bars{background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(15,2,1,.45));border:var(--gb);border-radius:20px;padding:8px 14px;box-shadow:var(--gs)}
.br{display:flex;align-items:center;gap:8px;font-size:12px;margin:8px 0}.br u{width:84px;text-decoration:none;color:var(--mut)}
.br div{flex:1;height:10px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.br i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yel));border-radius:6px;transition:width .6s ease}
.br em{font-style:normal;width:84px;text-align:right}
.pills{display:flex;gap:6px;margin-bottom:12px}
.pills button{flex:1;font:inherit;font-size:13px;color:var(--mut);background:var(--glass);border:var(--gb);border-radius:10px;padding:9px 0;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.pills button.on{color:#fff;background:var(--hot);border-color:rgba(255,235,170,.9)}
.nav2{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.nav2 button{font:inherit;color:var(--txt);background:var(--glass);border:var(--gb);border-radius:10px;width:44px;height:38px;font-size:20px;cursor:pointer}
.nav2 button:disabled{opacity:.3}.nav2 span{flex:1;text-align:center;font-size:14px;color:var(--yel)}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,1,1,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.show{opacity:1;pointer-events:auto}
.mbox{width:100%;max-width:360px;max-height:88vh;overflow-y:auto;border-radius:24px;padding:20px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(25,3,2,.85));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 20px 50px rgba(0,0,0,.5);transform:translateY(16px) scale(.97);transition:transform .35s ease}
.modal.show .mbox{transform:none}
.mbox h3{margin:0 0 4px;color:var(--yel);font-size:18px}.mbox h4{margin:14px 0 8px;color:var(--yel);font-size:14px}
.mbox p{font-size:13px;color:var(--mut);margin:6px 0 12px;line-height:1.5}.mbox p b{color:var(--txt)}
.mbox input{width:100%;font:inherit;font-size:16px;color:var(--txt);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px 14px;margin-bottom:10px;outline:0}
.mbox input:focus{border-color:var(--org)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-size:13px;color:var(--mut);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 0;cursor:pointer}
.seg button.on{color:#fff;background:var(--hot);border-color:rgba(255,235,170,.9)}
.mb{width:100%;font:inherit;font-weight:700;color:#fff;border:1px solid rgba(255,235,170,.6);border-radius:12px;padding:12px;cursor:pointer;background:var(--hot)}
.mb.g{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);margin-top:8px;font-weight:400}
.mb:disabled{opacity:.5}.mb.sm{padding:9px;font-size:13px;margin-bottom:6px}
.er{color:#ff9a8a!important;min-height:18px;margin:0 0 8px!important}
.ed{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ed input{width:auto;margin:0;min-width:0}.ed .en{flex:1.6}.ed .ep,.ed .el{flex:1}
.ed .ex{width:40px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.ed .ln{flex:1;font-size:14px}
</style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <button class="chip" id="bEdit">✏️ Edit</button>
    <button class="chip" id="bAkun">👤 Akun</button>
  </div>
  <img class="logo" alt="Logo Tahu Kocek Merapi" src="icon-192.png">
  <h1>Tahu Kocek Merapi</h1>
  <p class="sub">Pedas gurih banget! 🔥</p>

  <section class="pane on" id="p-menu">
    <h2>1. Pilih Jenis Tahu Kocek <span class="req">(opsional, maks. 50 per jenis)</span></h2>
    <div class="grid" id="jenis"></div>
    <div id="lvl">
      <h2>2. Pilih Level Kepedasan <span class="req">(opsional)</span></h2>
      <div id="lvlrows"></div>
    </div>
    <h2>3. Topping <span class="req">(opsional, maks. 25 per jenis)</span></h2>
    <div class="grid" id="top"></div>
    <h2>4. Jajan <span class="req">(opsional, maks. 25 per jenis)</span></h2>
    <div class="grid" id="jajan"></div>
  </section>

  <section class="pane" id="p-nota">
    <h2>Riwayat Nota</h2>
    <div id="hist"></div>
  </section>

  <section class="pane" id="p-lap">
    <h2>Penghasilan</h2>
    <div id="lap"></div>
  </section>
</main>

<div class="bar" id="bar"><div class="bi">
  <div class="tot" id="ring">Pilih menu dulu<b>Rp 0</b></div>
  <button id="order" disabled>OK</button>
</div></div>
<nav class="tabs">
  <button class="on" data-t="menu">🔥 Menu</button>
  <button data-t="nota">🧾 Nota<i id="cnt" hidden></i></button>
  <button data-t="laporan">💰 Laporan</button>
</nav>

<div class="modal" id="mEdit"></div>
<div class="modal" id="mAkun"></div>

<script>
/* Tahu Kocek Merapi - aplikasi utama (menu, nota, laporan, edit menu) */
(function(){
"use strict";
var WA="6285731051627",MAXQ=50,MAXS=25,MAXT=25,NK="nota_tahu",MK="menu_tahu";
var DEF={j:[["BIJIAN",2000,"Tahu Kocek "],["INCIP",7000,"Tahu Kocek "],["ABG",10000,"Tahu Kocek "],["MIX",13000,"Tahu Kocek "]],s:[["Sosis",2000],["Sosis 1/2",1000],["Bola Ikan",2000]],t:[["Gubis",1000],["Sosis",2000],["Fishball",2000]],l:[0,3000,5000]};
var LVL=[["1 – 5",1,5],["6 – 10",6,10],["11 – 15",11,15]];
var HR=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
var BL=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var App=window.App={onNotes:null,onMenu:null};
var jenis=[],jajan=[],tops=[],lvf=[0,3000,5000],H=[],st,RQ=[],RS=[],RT=[],vw="h",off=0;
var G=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function rp(n){return "Rp "+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function pad(n){return n<10?"0"+n:""+n}
function tgl(ts){var d=new Date(ts);return HR[d.getDay()]+", "+d.getDate()+" "+BL[d.getMonth()]+" "+d.getFullYear()+" • "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
function resetSt(){st={q:{},s:{},t:{},l:null}}

/* ---------- menu ---------- */
function cur(){return {j:jenis.map(function(x){return [x[0],x[1],x[2]||""]}),s:jajan.map(function(x){return [x[0],x[1]]}),t:tops.map(function(x){return [x[0],x[1]]}),l:lvf.slice()}}
function valid(m){return !!(m&&m.j&&m.j.length&&m.t&&m.l&&m.l.length==3)}
function clone(a){return a.map(function(x){return x.slice()})}
function loadMenu(){try{var s=localStorage.getItem(MK);return s?JSON.parse(s):null}catch(e){return null}}
function saveMenu(m){try{localStorage.setItem(MK,JSON.stringify(m))}catch(e){}}
function apply(m){jenis=clone(m.j);jajan=clone(m.s||DEF.s);tops=clone(m.t);lvf=m.l.slice();resetSt();build()}
function setMenu(m){apply(m);saveMenu(m)}

/* ---------- baris jumlah (+ dan -) ---------- */
function paintR(R,arr,i,max){var o=R[i];if(!o)return;var q=arr[i]||0;o.n.textContent=q;o.r.classList.toggle("on",q>0);o.m.disabled=q<1;o.p.disabled=q>=max}
function mkRows(box,list,key,max){var R=[];box.innerHTML="";
 list.forEach(function(x,i){var r=document.createElement("div");r.className="trow";
  r.innerHTML='<div class="tn"><b>'+esc((x[2]||"")+x[0])+'</b><span>'+rp(x[1])+' per porsi</span></div><div class="qty"><button class="qm" aria-label="Kurangi">−</button><i>0</i><button class="qp" aria-label="Tambah">+</button></div>';
  box.appendChild(r);R[i]={r:r,n:r.querySelector("i"),m:r.querySelector(".qm"),p:r.querySelector(".qp")};
  R[i].p.onclick=function(){st[key][i]=Math.min(max,(st[key][i]||0)+1);paintR(R,st[key],i,max);upd()};
  R[i].m.onclick=function(){st[key][i]=Math.max(0,(st[key][i]||0)-1);paintR(R,st[key],i,max);upd()};
  paintR(R,st[key],i,max)});
 return R}
function repaint(){jenis.forEach(function(x,i){paintR(RQ,st.q,i,MAXQ)});jajan.forEach(function(x,i){paintR(RS,st.s,i,MAXS)});tops.forEach(function(x,i){paintR(RT,st.t,i,MAXT)})}
function build(){
 RQ=mkRows(G("jenis"),jenis,"q",MAXQ);RS=mkRows(G("jajan"),jajan,"s",MAXS);RT=mkRows(G("top"),tops,"t",MAXT);
 var lr=G("lvlrows"),all=[];lr.innerHTML="";
 LVL.forEach(function(g,gi){var r=document.createElement("div");r.className="row";
  r.innerHTML='<div class="rh"><span>Level '+g[0]+'</span><em>'+(lvf[gi]>0?"+ "+rp(lvf[gi]):"Gratis")+'</em></div><div class="nums"></div>';
  var n=r.querySelector(".nums");
  for(var v=g[1];v<=g[2];v++)(function(v){var b=document.createElement("button");b.className="btn";b.textContent=v;n.appendChild(b);all.push([b,v]);
   b.onclick=function(){st.l=(st.l&&st.l[0]==v)?null:[v,lvf[gi]];all.forEach(function(e){e[0].classList.toggle("on",!!st.l&&st.l[0]==e[1])});upd()}})(v);
  lr.appendChild(r)});
 upd()}
function calc(){var pc=0,js=0,t=0;
 jenis.forEach(function(x,i){var n=st.q[i]||0;pc+=n;t+=x[1]*n});
 jajan.forEach(function(x,i){var n=st.s[i]||0;js+=n;t+=x[1]*n});
 if(pc){if(st.l)t+=st.l[1]*pc;tops.forEach(function(x,i){t+=x[1]*(st.t[i]||0)})}
 return {pc:pc,js:js,t:t}}
function upd(){var c=calc(),o=G("order"),r=G("ring");
 if(!c.pc&&st.l){st.l=null;document.querySelectorAll("#lvlrows .btn.on").forEach(function(b){b.classList.remove("on")})}
 G("lvl").classList.toggle("show",c.pc>0);
 if(!c.pc&&!c.js){r.innerHTML="Pilih menu dulu<b>Rp 0</b>";o.disabled=true;return}
 var p=[];if(c.pc)p.push(c.pc+" tahu"+(st.l?" · Level "+st.l[0]:""));if(c.js)p.push(c.js+" jajan");
 r.innerHTML=p.join(" · ")+"<b>"+rp(c.t)+"</b>";o.disabled=false}
function order(){var it=[],js=[],tp=[],tot=0,pc=0,jc=0;
 jenis.forEach(function(x,i){var n=st.q[i]||0;if(n>0){it.push(n>1?x[0]+" x"+n:x[0]);tot+=x[1]*n;pc+=n}});
 jajan.forEach(function(x,i){var n=st.s[i]||0;if(n>0){js.push(n>1?x[0]+" x"+n:x[0]);tot+=x[1]*n;jc+=n}});
 if(!pc&&!jc)return;
 if(pc){if(st.l)tot+=st.l[1]*pc;tops.forEach(function(x,i){var n=st.t[i]||0;if(n>0){tp.push(n>1?x[0]+" x"+n:x[0]);tot+=x[1]*n}})}
 H.unshift({id:H.length?H[0].id+1:1,j:it.join(", "),l:pc?(st.l?st.l[0]:"-"):"-",t:tp,s:js,tot:tot,ts:Date.now()});
 save();renderAll();
 resetSt();document.querySelectorAll("#lvlrows .btn.on").forEach(function(b){b.classList.remove("on")});
 repaint();upd();go("nota")}

/* ---------- nota ---------- */
function loadNotes(){try{var a=JSON.parse(localStorage.getItem(NK)||"[]");return Array.isArray(a)?a:[]}catch(e){return []}}
function persist(){try{localStorage.setItem(NK,JSON.stringify(H))}catch(e){}}
function save(){if(App.onNotes){try{App.onNotes(H)}catch(e){}}persist()}
function wal(n){var L=["Tahu Kocek Merapi:"],hj=n.j&&n.j!=="-";
 if(hj){L.push("- Jenis: "+n.j);L.push("- Level: "+n.l)}
 if(hj||(n.t&&n.t.length))L.push("- Topping: "+(n.t&&n.t.length?n.t.join(", "):"-"));
 if(n.s&&n.s.length)L.push("- Jajan: "+n.s.join(", "));
 L.push("- Total: "+rp(n.tot));L.push("- Waktu: "+tgl(n.ts));
 return "https://wa.me/"+WA+"?text="+encodeURIComponent(L.join("\n"))}
function renderNotes(){var c=G("hist"),k=G("cnt");k.hidden=!H.length;k.textContent=H.length;
 if(!H.length){c.innerHTML='<p class="empty">Belum ada nota.<br>Pesan dulu di tab Menu.</p>';return}
 c.innerHTML=H.map(function(n,i){var hj=n.j&&n.j!=="-",L="";
  if(hj)L+='<div>Jenis: '+esc(n.j)+'</div><div>Level: '+esc(n.l)+'</div>';
  if(hj||(n.t&&n.t.length))L+='<div>Topping: '+(n.t&&n.t.length?esc(n.t.join(", ")):"-")+'</div>';
  if(n.s&&n.s.length)L+='<div>Jajan: '+esc(n.s.join(", "))+'</div>';
  return '<div class="nota"><div class="nh"><b>Nota #'+n.id+'</b><span>'+tgl(n.ts)+'</span></div>'+L+'<div class="nt">Total: '+rp(n.tot)+'</div><div class="na"><a class="wa" href="'+wal(n)+'" target="_blank" rel="noopener">Kirim WA</a><button data-d="'+i+'">Hapus</button></div></div>'}).join("")}
G("hist").onclick=function(e){
 var a=e.target.closest&&e.target.closest("a.wa");
 if(a&&window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()){e.preventDefault();window.location.href=a.href;return}
 var d=e.target.getAttribute("data-d");
 if(d!==null&&confirm("Hapus nota ini?")){H.splice(+d,1);save();renderAll()}};

/* ---------- laporan ---------- */
function dr(v,o){var n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),a,b;
 if(v=="h"){a=new Date(y,m,d+o);b=new Date(y,m,d+o+1)}
 else if(v=="m"){var w=(n.getDay()+6)%7;a=new Date(y,m,d-w+o*7);b=new Date(y,m,d-w+o*7+7)}
 else if(v=="b"){a=new Date(y,m+o,1);b=new Date(y,m+o+1,1)}
 else{a=new Date(y+o,0,1);b=new Date(y+o+1,0,1)}
 return [a,b]}
function parseJ(s){return String(s||"").split(", ").filter(function(x){return x&&x!=="-"}).map(function(x){var m=/^(.*) x(\d+)$/.exec(x);return m?[m[1],+m[2]]:[x,1]})}
function lap(){
 var r=dr(vw,off),a=r[0],A=a.getTime(),B=r[1].getTime(),it=H.filter(function(x){return x.ts>=A&&x.ts<B}),tot=0,rows=[],i,ttl,sub;
 it.forEach(function(x){tot+=x.tot});
 var fd=function(d){return d.getDate()+" "+BL[d.getMonth()]};
 if(vw=="h"){ttl=(off==0?"Hari ini · ":"")+HR[a.getDay()]+", "+fd(a)+" "+a.getFullYear();sub="Rincian terjual (jumlah porsi)";
  var cnt={},ord=[],add=function(k,n){if(!(k in cnt)){cnt[k]=0;ord.push(k)}cnt[k]+=n};
  jenis.forEach(function(j){add(j[0],0)});jajan.forEach(function(j){add(j[0],0)});
  it.forEach(function(n){parseJ(n.j).forEach(function(p){add(p[0],p[1])});(n.s||[]).forEach(function(x){parseJ(x).forEach(function(p){add(p[0],p[1])})})});
  ord.forEach(function(k){rows.push([k,cnt[k],cnt[k]+" porsi"])})}
 else if(vw=="m"){var e=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);ttl=(off==0?"Minggu ini · ":"")+fd(a)+" – "+fd(e)+" "+e.getFullYear();sub="Rincian harian";
  for(i=0;i<7;i++){var d1=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i),s1=0;
   it.forEach(function(x){var q=new Date(x.ts);if(q.getDate()==d1.getDate()&&q.getMonth()==d1.getMonth())s1+=x.tot});
   rows.push([HR[d1.getDay()]+" "+d1.getDate(),s1,rp(s1)])}}
 else if(vw=="b"){ttl=(off==0?"Bulan ini · ":"")+BL[a.getMonth()]+" "+a.getFullYear();sub="Rincian mingguan";
  var w0=(a.getDay()+6)%7,dim=new Date(a.getFullYear(),a.getMonth()+1,0).getDate(),nw=Math.ceil((dim+w0)/7),ws=[];
  for(i=0;i<nw;i++)ws.push(0);
  it.forEach(function(x){ws[Math.floor((new Date(x.ts).getDate()-1+w0)/7)]+=x.tot});
  ws.forEach(function(v,k){rows.push(["Minggu ke-"+(k+1),v,rp(v)])})}
 else{ttl=(off==0?"Tahun ini · ":"")+a.getFullYear();sub="Rincian bulanan";
  var ms=[];for(i=0;i<12;i++)ms.push(0);
  it.forEach(function(x){ms[new Date(x.ts).getMonth()]+=x.tot});
  ms.forEach(function(v,k){rows.push([BL[k],v,rp(v)])})}
 var mx=1;rows.forEach(function(x){if(x[1]>mx)mx=x[1]});
 var pills=[["h","Harian"],["m","Mingguan"],["b","Bulanan"],["t","Tahunan"]].map(function(p){return '<button data-v="'+p[0]+'"'+(p[0]==vw?' class="on"':'')+'>'+p[1]+'</button>'}).join("");
 G("lap").innerHTML='<div class="pills">'+pills+'</div><div class="nav2"><button data-n="-1">‹</button><span>'+ttl+'</span><button data-n="1"'+(off>=0?' disabled':'')+'>›</button></div>'
 +'<div class="cards"><div class="card"><small>Total penghasilan</small><b>'+rp(tot)+'</b><span>'+it.length+' pesanan</span></div></div><h2>'+sub+'</h2>'
 +'<div class="bars">'+rows.map(function(x){return '<div class="br"><u>'+esc(x[0])+'</u><div><i style="width:'+Math.round(x[1]/mx*100)+'%"></i></div><em>'+x[2]+'</em></div>'}).join("")+'</div>'
 +'<p class="empty">Harian yang sudah lewat tetap bisa dilihat di Mingguan, mingguan di Bulanan, dan bulanan di Tahunan. Data dari nota di HP ini.</p>'}
G("lap").onclick=function(e){var v=e.target.getAttribute("data-v"),n=e.target.getAttribute("data-n");
 if(v){vw=v;off=0;lap()}else if(n){off+=+n;lap()}};
function renderAll(){renderNotes();lap()}

/* ---------- tab ---------- */
function go(t){
 document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-t")==t)});
 G("p-menu").classList.toggle("on",t=="menu");G("p-nota").classList.toggle("on",t=="nota");G("p-lap").classList.toggle("on",t=="laporan");
 G("bar").classList.toggle("hide",t!="menu");window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-t"))}});
G("order").onclick=order;

/* ---------- edit menu ---------- */
var ed=G("mEdit");
function row(n,p,pre){return '<div class="ed" data-p="'+esc(pre||"")+'"><input class="en" maxlength="30" placeholder="Nama" value="'+esc(n)+'"><input class="ep" type="number" inputmode="numeric" min="0" placeholder="Harga" value="'+p+'"><button class="ex" data-a="del" aria-label="Hapus">🗑</button></div>'}
function openEd(){var m=cur();
 ed.innerHTML='<div class="mbox"><h3>Edit Menu</h3><p>Ubah nama dan harga, hapus, atau tambah menu baru. Setelah disimpan langsung dipakai.</p>'
 +'<h4>Jenis tahu kocek</h4><div id="ej">'+m.j.map(function(x){return row(x[0],x[1],x[2])}).join("")+'</div><button class="mb g sm" data-a="addj">+ Tambah jenis</button>'
 +'<h4>Topping</h4><div id="et">'+m.t.map(function(x){return row(x[0],x[1])}).join("")+'</div><button class="mb g sm" data-a="addt">+ Tambah topping</button>'
 +'<h4>Jajan</h4><div id="es">'+m.s.map(function(x){return row(x[0],x[1])}).join("")+'</div><button class="mb g sm" data-a="adds">+ Tambah jajan</button>'
 +'<h4>Harga tambahan level</h4>'+LVL.map(function(g,i){return '<div class="ed"><span class="ln">Level '+g[0]+'</span><input class="el" type="number" inputmode="numeric" min="0" value="'+m.l[i]+'"></div>'}).join("")
 +'<p class="er" id="eer"></p><button class="mb" data-a="save">Simpan</button><button class="mb g" data-a="cancel">Batal</button><button class="mb g" data-a="reset">Kembalikan menu awal</button></div>';
 ed.classList.add("show")}
function rd(id){var a=[],ok=true;
 ed.querySelectorAll("#"+id+" .ed").forEach(function(r){var n=r.querySelector(".en").value.replace(/[<>"&]/g,"").trim(),p=r.querySelector(".ep").value;
  if(!n&&p==="")return;var v=Number(p);
  if(!n||p===""||isNaN(v)||v<0||v>10000000){ok=false;return}
  var o=[n,Math.round(v)];if(id=="ej")o.push(r.getAttribute("data-p")||"");a.push(o)});
 return ok?a:null}
function dup(a){var s={};for(var i=0;i<a.length;i++){var k=a[i][0].toLowerCase();if(s[k])return true;s[k]=1}return false}
function saveEd(){var er=G("eer"),j=rd("ej"),t=rd("et"),s=rd("es"),l=[],bad=false;
 ed.querySelectorAll(".el").forEach(function(e){var v=Number(e.value);if(e.value===""||isNaN(v)||v<0||v>10000000)bad=true;l.push(Math.round(v))});
 if(!j||!t||!s||bad){er.textContent="Nama harus diisi dan harga harus angka 0 atau lebih";return}
 if(!j.length&&!s.length){er.textContent="Minimal ada 1 jenis tahu atau 1 jajan";return}
 if(dup(j.concat(s))||dup(t)){er.textContent="Nama tidak boleh sama dalam satu daftar";return}
 var m={j:j,s:s,t:t,l:l};setMenu(m);if(App.onMenu)App.onMenu(m);ed.classList.remove("show")}
ed.onclick=function(e){if(e.target===ed){ed.classList.remove("show");return}
 var a=e.target.getAttribute("data-a");if(!a)return;
 if(a=="del"){var r=e.target.closest(".ed");if(r)r.remove()}
 else if(a=="addj")G("ej").insertAdjacentHTML("beforeend",row("","",""))
 else if(a=="addt")G("et").insertAdjacentHTML("beforeend",row("",""))
 else if(a=="adds")G("es").insertAdjacentHTML("beforeend",row("",""))
 else if(a=="save")saveEd()
 else if(a=="cancel")ed.classList.remove("show")
 else if(a=="reset"){if(confirm("Kembalikan menu, harga, dan topping ke pengaturan awal?")){var m=JSON.parse(JSON.stringify(DEF));setMenu(m);if(App.onMenu)App.onMenu(m);ed.classList.remove("show")}}};
G("bEdit").onclick=openEd;
