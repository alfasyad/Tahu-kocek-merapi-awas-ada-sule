<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tahu Kocek">
<meta name="theme-color" content="#7a0a05">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tahu Kocek Merapi</title>
<style>
:root{--bg:#1d0402;--card:#3a0a06;--line:#7a1d10;--txt:#fff4e6;--mut:#f0b49a;--red:#e5200f;--yel:#ffd21f;--org:#ff7a00;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:linear-gradient(160deg,#2b0503,#8a0c05 45%,#2b0503);background-size:300% 300%;animation:bg 14s ease infinite;background-color:var(--bg)}
@keyframes bg{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 200px}
.logo{display:block;width:170px;height:170px;border-radius:50%;margin:6px auto 4px;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 22px #ff4a0077}50%{box-shadow:0 0 54px #ff6a00cc}}
h1{text-align:center;margin:6px 0 2px;font-size:27px;color:var(--yel);animation:fl 2.2s ease-in-out infinite}
@keyframes fl{0%,100%{text-shadow:0 0 8px #ff5a00}50%{text-shadow:0 0 20px #ff2a00,0 0 4px #ffd21f}}
.sub{text-align:center;color:var(--mut);margin:0 0 6px;font-size:14px}
h2{font-size:16px;margin:22px 0 10px;color:var(--yel)}
.req{color:var(--mut);font-size:12px;font-weight:400}
.pane{display:none}.pane.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:10px}
.btn{font:inherit;color:var(--txt);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:transform .25s ease,background .3s ease,border-color .3s ease,box-shadow .3s ease}
.btn:active{transform:scale(.96)}
.btn.on{background:linear-gradient(135deg,var(--red),var(--org));border-color:var(--yel);box-shadow:0 0 20px #ff4a00aa;transform:scale(1.02)}
.btn b{font-size:16px}.btn span{font-size:14px;opacity:.92}
#lvl{max-height:0;opacity:0;overflow:hidden;transition:max-height .7s ease,opacity .6s ease}
#lvl.show{max-height:700px;opacity:1}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.rh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}.rh em{font-style:normal;color:var(--yel);font-weight:700}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nums .btn{justify-content:center;padding:10px 0;border-radius:10px}
.nota{background:var(--card);border:1px dashed var(--org);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.65;animation:in .45s ease}
.nh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:6px}
.nh span{color:var(--mut);font-size:13px}.nt{color:var(--yel);font-weight:700}
.na{display:flex;gap:8px;margin-top:10px}
.na a,.na button{font:inherit;font-size:13px;color:#fff;border-radius:8px;padding:8px 14px;text-decoration:none;border:0;cursor:pointer}
.na a{background:#1fa855}.na button{background:#5a140b;border:1px solid var(--line)}
.empty{color:var(--mut);font-size:14px;text-align:center;margin-top:30px}
.bar,.tabs{position:fixed;left:0;right:0;background:#240603f2;backdrop-filter:blur(8px)}
.bar{bottom:calc(60px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--red);padding:10px 16px;transition:transform .4s ease,opacity .4s ease}
.bar.hide{transform:translateY(130%);opacity:0;pointer-events:none}
.bi{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tot{flex:1;font-size:13px;color:var(--mut)}.tot b{display:block;font-size:20px;color:var(--yel)}
#order{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 28px;color:#fff;background:linear-gradient(135deg,var(--red),var(--org));cursor:pointer;transition:transform .2s,opacity .3s}
#order:active{transform:scale(.94)}#order:disabled{opacity:.4}
.tabs{bottom:0;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--line)}
.tabs button{flex:1;font:inherit;font-size:14px;color:var(--mut);background:none;border:0;padding:14px 0 12px;cursor:pointer;transition:color .3s,background .3s}
.tabs button.on{color:var(--yel);background:linear-gradient(0deg,#7a0a0566,transparent);box-shadow:inset 0 3px 0 var(--red)}
.tabs i{font-style:normal;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;margin-left:4px}
</style>
</head>

  <h1>Tahu Kocek Merapi</h1>
  <p class="sub">Pedas gurih banget! 🔥</p>

  <section class="pane on" id="p-menu">
    <h2>1. Pilih Jenis Tahu Kocek <span class="req">(wajib)</span></h2>
    <div class="grid" id="jenis"></div>
    <div id="lvl">
      <h2>2. Pilih Level Kepedasan <span class="req">(wajib)</span></h2>
      <div id="lvlrows"></div>
    </div>
    <h2>3. Topping <span class="req">(opsional, boleh lebih dari satu)</span></h2>
    <div class="grid" id="top"></div>
  </section>

  <section class="pane" id="p-nota">
    <h2>Riwayat Nota</h2>
    <div id="hist"></div>
  </section>
</main>

<div class="bar" id="bar"><div class="bi">
  <div class="tot" id="ring">Pilih tahu dulu<b>Rp 0</b></div>
  <button id="order" disabled>OK</button>
</div></div>
<nav class="tabs">
  <button class="on" data-t="menu">🔥 Menu</button>
  <button data-t="nota">🧾 Nota<i id="cnt" hidden></i></button>
</nav>

<script>
var WA="6285731051627";
var jenis=[["INCIP",7000],["ABG",10000],["MIX",13000]];
var tops=[["Gubis",1000],["Sosis",2000],["Fishball",2000]];
var lv=[["1 – 5","Gratis",0,1,5],["6 – 10","+ Rp 3.000",3000,6,10],["11 – 15","+ Rp 5.000",5000,11,15]];
var st={j:null,l:null,t:{}},H=[];
try{H=JSON.parse(localStorage.getItem("nota_tahu")||"[]")}catch(e){H=[]}
var HR=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"],BL=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function $(i){return document.getElementById(i)}
function rp(n){return "Rp "+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function pad(n){return n<10?"0"+n:""+n}
function tgl(ts){var d=new Date(ts);return HR[d.getDay()]+", "+d.getDate()+" "+BL[d.getMonth()]+" "+d.getFullYear()+" • "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
function save(){try{localStorage.setItem("nota_tahu",JSON.stringify(H))}catch(e){}}
function mk(par,html){var b=document.createElement("button");b.className="btn";b.innerHTML=html;par.appendChild(b);return b}

var jb=[],nb=[];
jenis.forEach(function(x,i){var b=mk($("jenis"),"<b>Tahu Kocek "+x[0]+"</b><span>"+rp(x[1])+"</span>");jb.push(b);
 b.onclick=function(){st.j=i;jb.forEach(function(e,k){e.classList.toggle("on",k==i)});$("lvl").classList.add("show");upd()}});
tops.forEach(function(x,i){var b=mk($("top"),"<b>"+x[0]+"</b><span>+ "+rp(x[1])+"</span>");
 b.onclick=function(){st.t[i]=!st.t[i];b.classList.toggle("on",!!st.t[i]);upd()}});
lv.forEach(function(g){var r=document.createElement("div");r.className="row";
 r.innerHTML='<div class="rh"><span>Level '+g[0]+'</span><em>'+g[1]+'</em></div>';
 var n=document.createElement("div");n.className="nums";r.appendChild(n);
 for(var v=g[3];v<=g[4];v++)(function(v){var b=mk(n,v);nb.push([b,v]);
  b.onclick=function(){st.l=[v,g[2]];nb.forEach(function(e){e[0].classList.toggle("on",e[1]==v)});upd()}})(v);
 $("lvlrows").appendChild(r)});

function upd(){
 var o=$("order"),r=$("ring");
 if(st.j===null){r.innerHTML="Pilih tahu dulu<b>Rp 0</b>";o.disabled=true;return}
 var t=jenis[st.j][1]+(st.l?st.l[1]:0);
 tops.forEach(function(x,i){if(st.t[i])t+=x[1]});
 r.innerHTML=(st.l?"Level "+st.l[0]:"Pilih level")+"<b>"+rp(t)+"</b>";
 o.disabled=!st.l;
}
function wal(n){
 var m="Tahu Kocek Merapi:\n- Jenis: "+n.j+"\n- Level: "+n.l+"\n- Topping: "+(n.t.length?n.t.join(", "):"-")+"\n- Total: "+rp(n.tot)+"\n- Waktu: "+tgl(n.ts);
 return "https://wa.me/"+WA+"?text="+encodeURIComponent(m)}
function render(){
 var c=$("hist"),k=$("cnt");k.hidden=!H.length;k.textContent=H.length;
 if(!H.length){c.innerHTML='<p class="empty">Belum ada nota.<br>Pesan dulu di tab Menu.</p>';return}
 c.innerHTML=H.map(function(n,i){return '<div class="nota"><div class="nh"><b>Nota #'+n.id+'</b><span>'+tgl(n.ts)+'</span></div><div>Jenis: '+n.j+'</div><div>Level: '+n.l+'</div><div>Topping: '+(n.t.length?n.t.join(", "):"-")+'</div><div class="nt">Total: '+rp(n.tot)+'</div><div class="na"><a class="wa" href="'+wal(n)+'" target="_blank" rel="noopener">Kirim WA</a><button data-d="'+i+'">Hapus</button></div></div>'}).join("")}
$("hist").onclick=function(e){
 var a=e.target.closest&&e.target.closest("a.wa");
 if(a&&window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){e.preventDefault();window.location.href=a.href;return}
 var d=e.target.getAttribute("data-d");if(d!==null){H.splice(d,1);save();render()}};
function go(t){
 document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-t")==t)});
 $("p-menu").classList.toggle("on",t=="menu");$("p-nota").classList.toggle("on",t=="nota");
 $("bar").classList.toggle("hide",t!="menu");window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-t"))}});
$("order").onclick=function(){
 var tp=tops.filter(function(x,i){return st.t[i]}).map(function(x){return x[0]});
 var tot=jenis[st.j][1]+st.l[1];tops.forEach(function(x,i){if(st.t[i])tot+=x[1]});
 H.unshift({id:H.length?H[0].id+1:1,j:jenis[st.j][0],l:st.l[0],t:tp,tot:tot,ts:Date.now()});
 save();render();
 st={j:null,l:null,t:{}};
 document.querySelectorAll(".btn.on").forEach(function(b){b.classList.remove("on")});
 $("lvl").classList.remove("show");upd();go("nota")};
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0&&!window.Capacitor){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js")["catch"](function(){})}catch(e){}})}
</script>
</body>
</html>
